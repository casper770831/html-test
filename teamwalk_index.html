<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamWalk 註冊完成（Universal Link 測試）</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; background: #f5f5f5; color: #333; }
    h1 { font-size: 22px; text-align: center; margin: 24px 0 8px; }
    p.desc { text-align: center; color: #666; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 16px; margin: 0 0 12px; }
    .btn { display: block; text-align: center; padding: 14px; border-radius: 8px; font-size: 17px; text-decoration: none; border: none; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
    .primary { background: #00a0e9; color: #fff; }
    .secondary { background: #e0e0e0; color: #333; }
    .note { font-size: 13px; color: #888; margin: 4px 0 0; }
    select { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>註冊完成</h1>
  <p class="desc">請返回 TeamWalk App 登入</p>

  <div class="card">
    <h2>環境</h2>
    <select id="env" onchange="updateLinks()">
      <option value="https://demo.mutron.com.tw">SIT（demo.mutron.com.tw）</option>
    </select>
  </div>

  <div class="card">
    <h2>使用者點擊</h2>
    <a id="mainLink" class="btn primary" href="https://demo.mutron.com.tw/app/register-complete">返回 TeamWalk 登入</a>
    <p class="note">預期：直接開啟 App 並回到登入頁</p>
  </div>

  <script>
    function target() {
      return document.getElementById('env').value + '/app/register-complete';
    }
    function updateLinks() {
      var base = document.getElementById('env').value;
      document.getElementById('mainLink').href = base + '/app/register-complete';
      document.getElementById('wrongPathLink').href = base + '/app/other';
    }
  </script>
</body>
</html>
